<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="dark light" />
    <meta name="description" content="AfterFrame — The film doesn't end at the credits. Premium movie and TV discovery, trending people, regional charts, community ratings, and cinema gatherings." />
    <title>AfterFrame — The film doesn't end at the credits</title>

    <!-- Google Fonts: Outfit, Inter & Cinematic Editorial Serifs (Cinzel & Cormorant Garamond) -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;600;700&family=Cormorant+Garamond:ital,wght@0,500;0,600;0,700;1,500&family=Outfit:wght@400;500;600;700;800;900&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">

    <!-- FOUC Prevention Script -->
    <script>
      (function() {
        try {
          const stored = localStorage.getItem('afterframe-theme') || 'dark';
          document.documentElement.setAttribute('data-theme', stored);
          const metaScheme = document.querySelector('meta[name="color-scheme"]');
          if (metaScheme) metaScheme.content = stored;
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
